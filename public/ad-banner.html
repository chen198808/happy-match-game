<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    #ad-frame {
      width: 100%;
      height: 90px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="ad-frame" src="about:blank"></iframe>
  <script>
    (function() {
      var adUrl = 'http://wm.lrswl.com/page/?s=295046';
      var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(adUrl);
      
      var iframe = document.getElementById('ad-frame');
      iframe.src = proxyUrl;
      
      iframe.onerror = function() {
        var backupProxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(adUrl);
        iframe.src = backupProxy;
      };
    })();
  </script>
</body>
</html>
